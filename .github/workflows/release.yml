name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openzigs/openzigs-social

jobs:
  quality-gate:
    name: Quality gate (lint + typecheck + test + coverage)
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test + coverage gate (≥80%)
        run: pnpm coverage

      - name: Lint UI
        working-directory: ui
        run: pnpm lint

      - name: UI coverage gate (≥80%)
        working-directory: ui
        run: pnpm test:coverage

      - name: Build UI
        working-directory: ui
        run: pnpm build

  license-check:
    name: License compatibility check (#146)
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses (root)
        run: pnpm licenses

  sbom:
    name: Generate SBOM (#146)
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate server SBOM
        run: npx @cyclonedx/cdxgen -o sbom.json

      - name: Generate UI SBOM
        working-directory: ui
        run: npx @cyclonedx/cdxgen -o ui-sbom.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.json
            ui/ui-sbom.json
          retention-days: 90

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [quality-gate, license-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tauri-stub:
    name: Tauri desktop binaries (pending epic #108)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Tauri artifacts — pending epic #108
        run: |
          echo "Tauri desktop binaries (.dmg + .msi) are not yet implemented."
          echo "This step is a placeholder for epic #108 (Tauri desktop app)."
          echo "Uncomment and implement when epic #108 ships."

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [docker, sbom]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: release-artifacts/

      - name: Copy docker-compose.yml
        run: cp docker-compose.yml release-artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/sbom.json
            release-artifacts/ui-sbom.json
            release-artifacts/docker-compose.yml
