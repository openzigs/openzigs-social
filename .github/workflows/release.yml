name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openzigs/openzigs-social

jobs:
  quality-gate:
    name: Quality gate (lint + typecheck + test + coverage)
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test + coverage gate (≥80%)
        run: pnpm coverage

      - name: Lint UI
        working-directory: ui
        run: pnpm lint

      - name: UI coverage gate (≥80%)
        working-directory: ui
        run: pnpm test:coverage

      - name: Build UI
        working-directory: ui
        run: pnpm build

  license-check:
    name: License compatibility check (#146)
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses (root)
        run: pnpm licenses

  sbom:
    name: Generate SBOM (#146)
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate server SBOM
        run: npx @cyclonedx/cdxgen -o sbom.json

      - name: Generate UI SBOM
        working-directory: ui
        run: npx @cyclonedx/cdxgen -o ui-sbom.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            ui/ui-sbom.json
          retention-days: 90

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [quality-gate, license-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build server
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tauri-desktop:
    name: Tauri desktop — ${{ matrix.platform }}
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (arm64 + x86_64) — signing + notarisation
          # requires the secrets listed below (#111).
          - platform: macos-latest
            args: --target universal-apple-darwin
            artifact-suffix: macos
          # Windows MSVC — signing requires #112 secrets.
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            artifact-suffix: windows
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable Corepack + install deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Build the Node server sidecar binary for this target.
      - name: Build server sidecar
        run: pnpm build && node scripts/build-sidecar.mjs
        env:
          TARGET_TRIPLE: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      # macOS code signing + notarisation (#111).
      # Requires these repository secrets (Settings → Secrets → Actions):
      #   APPLE_CERTIFICATE        — base64-encoded .p12 Developer ID Application cert
      #   APPLE_CERTIFICATE_PASSWORD — .p12 passphrase
      #   APPLE_ID                 — Apple ID used to notarise (e.g. dev@example.com)
      #   APPLE_TEAM_ID            — 10-char Team ID from developer.apple.com
      #   APPLE_APP_SPECIFIC_PASSWORD — app-specific password from appleid.apple.com
      # Until those secrets are configured the step is a no-op (secrets resolve
      # to empty strings and tauri-action skips signing gracefully).

      # Windows code signing (#112).
      # Requires:
      #   WINDOWS_CERTIFICATE      — base64-encoded .pfx signing certificate
      #   WINDOWS_CERTIFICATE_PASSWORD — .pfx passphrase

      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD: "1"
          # macOS signing (#111) — no-op until secrets are provisioned
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Windows signing (#112) — no-op until secrets are provisioned
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npx @tauri-apps/cli
          args: ${{ matrix.args }}

  github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [docker, sbom, tauri-desktop]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: release-artifacts/

      - name: Copy docker-compose.yml
        run: cp docker-compose.yml release-artifacts/

      - name: Download Tauri artifacts (macOS)
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*-macos*
          path: release-artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Download Tauri artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*-windows*
          path: release-artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/sbom.json
            release-artifacts/ui-sbom.json
            release-artifacts/docker-compose.yml
            release-artifacts/**/*.dmg
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
