name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + typecheck + test)
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Coverage (must meet ≥80% threshold)
        run: pnpm coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: coverage/
          retention-days: 7

  ui:
    name: UI (lint + build)
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint UI
        working-directory: ui
        run: pnpm lint
      - name: Coverage UI (must meet ≥80% threshold)
        working-directory: ui
        run: pnpm test:coverage
      - name: Upload UI coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage
          path: ui/coverage/
          retention-days: 7
      - name: Build UI
        working-directory: ui
        run: pnpm build

  ui-e2e:
    name: UI (Playwright e2e)
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PRODUCTION: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI
        working-directory: ui
        run: pnpm build
      - name: Install Playwright browsers
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        working-directory: ui
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
