[package]
name = "openzigs-social"
version = "0.1.0"
description = "openzigs social — focused, agentic, local-first social media manager"
authors = ["openzigs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "openzigs_social_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openzigs-social"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
